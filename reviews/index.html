<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Al-Taiba Crispy Chicken Center | Feedback Helper</title>
    <!-- Prevent Search Engines from indexing this AI text generator to protect entity signals -->
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://altaibacrispychickencenter.com/reviews/">
    
    <!-- Google Fonts matching main site -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-primary: #ffa033;
            --color-primary-hover: #e68d2b;
            --color-accent: #F59E0B;
            --color-accent-hover: #D97706;
            --color-text-dark: #1F2937;
            --color-text-light: #6B7280;
            --color-bg-white: #FFFFFF;
            --color-bg-offwhite: #F9FAFB;
            
            --font-anchor: 'Inter', sans-serif;
            --font-flair: 'Playfair Display', serif;
            --radius-pill: 50px;
            --radius-soft: 16px;
            --radius-softer: 24px;
            
            --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --transition-smooth: 0.3s ease-out;
            --transition-bounce: 0.4s var(--spring);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-anchor);
            color: var(--color-text-dark);
            background-color: var(--color-bg-offwhite);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--color-primary);
            background: rgba(255, 160, 51, 0.12);
            padding: 6px 16px;
            border-radius: var(--radius-pill);
            margin-bottom: 12px;
        }

        .brand-title {
            font-family: var(--font-flair);
            font-size: clamp(26px, 6vw, 34px);
            font-weight: 700;
            color: var(--color-text-dark);
            margin-bottom: 8px;
        }

        .brand-subtitle {
            font-size: 15px;
            color: var(--color-text-light);
            padding: 0 10px;
        }

        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .controls-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--color-text-light);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin: 0;
        }

        .refresh-btn {
            background: transparent;
            color: var(--color-text-light);
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: color var(--transition-smooth), background-color var(--transition-smooth);
        }

        .refresh-btn:hover {
            color: var(--color-primary);
            background-color: rgba(255, 160, 51, 0.08);
        }

        .refresh-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            transition: transform 0.4s ease;
        }

        .refresh-btn:hover svg {
            transform: rotate(180deg);
        }

        .star-banner {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-top: 10px;
            color: var(--color-accent);
            font-size: 20px;
        }

        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .review-card {
            background-color: var(--color-bg-white);
            border: 2px solid rgba(0, 0, 0, 0.05);
            border-radius: var(--radius-soft);
            padding: 20px;
            cursor: pointer;
            transition: transform var(--transition-bounce), border-color var(--transition-smooth), box-shadow var(--transition-smooth);
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .review-card:hover {
            border-color: var(--color-primary);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 160, 51, 0.12);
        }

        .review-card:active {
            transform: scale(0.98);
        }

        .card-rating {
            font-size: 14px;
            color: var(--color-accent);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-tag {
            font-size: 11px;
            font-weight: 600;
            color: var(--color-text-light);
            background: var(--color-bg-offwhite);
            padding: 2px 8px;
            border-radius: 6px;
        }

        .review-text {
            font-size: 16px;
            font-weight: 500;
            color: var(--color-text-dark);
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .card-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 20px;
            background-color: var(--color-primary);
            color: white;
            font-size: 14px;
            font-weight: 600;
            border-radius: var(--radius-pill);
            transition: background-color var(--transition-smooth);
        }

        .review-card:hover .card-action {
            background-color: var(--color-primary-hover);
        }

        .card-action svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .review-card.copied {
            border-color: #10B981;
            background-color: #ECFDF5;
        }

        .review-card.copied .card-action {
            background-color: #10B981;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--color-text-dark);
            color: white;
            padding: 12px 24px;
            border-radius: var(--radius-pill);
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            opacity: 0;
            transition: transform 0.4s var(--spring), opacity 0.3s ease;
            z-index: 1000;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: var(--color-text-light);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

    <main class="app-container">
        <header class="brand-header">
            <span class="brand-badge">AI Review Assistant</span>
            <h1 class="brand-title">Al-Taiba Crispy Chicken Center</h1>
            <p class="brand-subtitle">Tap a review below to copy it and instantly open our Google page to paste it!</p>
            <div class="star-banner">★★★★★</div>
        </header>

        <div class="controls-header">
            <h2 class="controls-title">Suggested Reviews</h2>
            <button class="refresh-btn" id="refresh-btn" aria-label="Load different reviews">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
        </div>

        <div class="cards-list" id="cards-container">
        </div>

    </main>

    <div class="toast" id="toast">Copied! Opening Google Maps...</div>

    <footer class="footer">
        &copy; <span id="year"></span> Al-Taiba Crispy Chicken Center
    </footer>

    <script>
        const REVIEW_REDIRECT_URL = "https://search.google.com/local/writereview?placeid=ChIJCQ3zq3sXrjsRgwWRAXU4hMA";

        const presetReviews = [
            "The loaded fries was really good, especially the chicken. 👍",
            "Chicken shawarma was tasty and fresh. ⭐",
            "Hot crispy burger is really nice.",
            "Popcorn chicken was crispy and tasty.",
            "Broast chicken was very good, will order again.",
            "Pizza was good and quantity also nice.",
            "Nice place, good food. 👍",
            "Super taste ⭐",
            "Al Taiba CCC best.",
            "Good food and friendly service.",
            "The loaded was my favourite, very tasty.",
            "Chicken shawarma was really good.",
            "Burger was hot and crispy just like the name.",
            "Popcorn chicken is very nice, crispy outside.",
            "Good service and food came fast.",
            "Broast chicken was juicy and tasty.",
            "Nice food, good service 👍",
            "Very good taste ⭐⭐⭐⭐⭐",
            "Al Taiba CCC is best for chicken.",
            "Had the loaded fries, really enjoyed it.",
            "Shawarma was fresh and tasty.",
            "Crispy burger was very good.",
            "Good quantity and good taste.",
            "Popcorn chicken was crispy and hot.",
            "Service was nice and staff were friendly.",
            "Broast chicken was tasty, definitely worth trying.",
            "Pizza was nice, especially when hot.",
            "Super food, good taste 👍",
            "Nice place for chicken lovers.",
            "Loaded fries was too good.",
            "Chicken shawarma + popcorn chicken, both very nice.",
            "Food was hot and fresh when served.",
            "Good service and no long waiting.",
            "Hot crispy burger is really worth trying.",
            "Broast chicken was very tasty ⭐",
            "Simple place but food is good.",
            "Al Taiba CCC best chicken place 👍",
            "Everything was good, will come again.",
            "Good taste, good service, reasonable food.",
            "Nice experience, chicken was fresh and crispy."
        ];

        let currentSelection = [];

        function getRandomReviews() {
            const shuffled = [...presetReviews].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, 3);
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            currentSelection = getRandomReviews();

            currentSelection.forEach((text, index) => {
                const card = document.createElement('div');
                card.className = 'review-card';
                card.innerHTML = `
                    <div class="card-rating">
                        <span>★★★★★</span>
                        <span class="card-tag">Option ${index + 1}</span>
                    </div>
                    <p class="review-text">"${text}"</p>
                    <div class="card-action">
                        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                        Tap to Select & Open Maps
                    </div>
                `;

                card.addEventListener('click', () => handleCardClick(text, card));
                container.appendChild(card);
            });
        }

        async function handleCardClick(text, cardElement) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                }

                cardElement.classList.add('copied');
                const actionBtn = cardElement.querySelector('.card-action');
                actionBtn.innerHTML = `✓ Copied! Redirecting...`;
                showToast();

                setTimeout(() => {
                    window.location.href = REVIEW_REDIRECT_URL;
                }, 700);

            } catch (err) {
                window.location.href = REVIEW_REDIRECT_URL;
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('year').textContent = new Date().getFullYear();
            renderCards();
            document.getElementById('refresh-btn').addEventListener('click', renderCards);
        });
    </script>
</body>
</html>
