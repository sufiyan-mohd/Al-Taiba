<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://www.altaibacrispychickencenter.com/reviews/frazer-town">
    
    <!-- Google Fonts matching main site -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-primary: #ffa033;
            --color-primary-hover: #e68d2b;
            --color-accent: #F59E0B;
            --color-accent-hover: #D97706;
            --color-text-dark: #1F2937;
            --color-text-light: #6B7280;
            --color-bg-white: #FFFFFF;
            --color-bg-offwhite: #F9FAFB;
            
            --font-anchor: 'Inter', sans-serif;
            --font-flair: 'Playfair Display', serif;
            --radius-pill: 50px;
            --radius-soft: 16px;
            --radius-softer: 24px;
            
            --spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
            --transition-smooth: 0.3s ease-out;
            --transition-bounce: 0.4s var(--spring);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-anchor);
            color: var(--color-text-dark);
            background-color: var(--color-bg-offwhite);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--color-primary);
            background: rgba(255, 160, 51, 0.12);
            padding: 6px 16px;
            border-radius: var(--radius-pill);
            margin-bottom: 12px;
        }

        .brand-title {
            font-family: var(--font-flair);
            font-size: clamp(26px, 6vw, 34px);
            font-weight: 700;
            color: var(--color-text-dark);
            margin-bottom: 8px;
            line-height: 1.2;
        }
        
        .brand-location {
            display: block;
            font-family: var(--font-anchor);
            font-size: clamp(16px, 4vw, 20px);
            font-weight: 500;
            color: var(--color-text-light);
            margin-top: 4px;
        }

        .brand-subtitle {
            font-size: 15px;
            color: var(--color-text-light);
            padding: 0 10px;
        }

        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .controls-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--color-text-light);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin: 0;
        }

        .refresh-btn {
            background: transparent;
            color: var(--color-text-light);
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: color var(--transition-smooth), background-color var(--transition-smooth);
        }

        .refresh-btn:hover {
            color: var(--color-primary);
            background-color: rgba(255, 160, 51, 0.08);
        }

        .refresh-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
            transition: transform 0.4s ease;
        }

        .refresh-btn:hover svg {
            transform: rotate(180deg);
        }

        .star-banner {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-top: 10px;
            color: var(--color-accent);
            font-size: 20px;
        }

        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .review-card {
            background-color: var(--color-bg-white);
            border: 2px solid rgba(0, 0, 0, 0.05);
            border-radius: var(--radius-soft);
            padding: 20px;
            cursor: pointer;
            transition: transform var(--transition-bounce), border-color var(--transition-smooth), box-shadow var(--transition-smooth);
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .review-card:hover {
            border-color: var(--color-primary);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 160, 51, 0.12);
        }

        .review-card:active {
            transform: scale(0.98);
        }

        .card-rating {
            font-size: 14px;
            color: var(--color-accent);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-tag {
            font-size: 11px;
            font-weight: 600;
            color: var(--color-text-light);
            background: var(--color-bg-offwhite);
            padding: 2px 8px;
            border-radius: 6px;
        }

        .review-text {
            font-size: 16px;
            font-weight: 500;
            color: var(--color-text-dark);
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .card-action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 20px;
            background-color: var(--color-primary);
            color: white;
            font-size: 14px;
            font-weight: 600;
            border-radius: var(--radius-pill);
            transition: background-color var(--transition-smooth);
        }

        .review-card:hover .card-action {
            background-color: var(--color-primary-hover);
        }

        .card-action svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .review-card.copied {
            border-color: #10B981;
            background-color: #ECFDF5;
        }

        .review-card.copied .card-action {
            background-color: #10B981;
        }

        /* Added to support locking out unselected reviews */
        .review-card.disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(100%);
            border-color: rgba(0, 0, 0, 0.05);
            transform: none;
            box-shadow: none;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--color-text-dark);
            color: white;
            padding: 12px 24px;
            border-radius: var(--radius-pill);
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            opacity: 0;
            transition: transform 0.4s var(--spring), opacity 0.3s ease;
            z-index: 1000;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: var(--color-text-light);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

    <main class="app-container">
        <header class="brand-header">
            <span class="brand-badge">AI Review Assistant</span>
            <h1 class="brand-title">Al-Taiba Crispy Chicken Center <span class="brand-location">Frazer Town</span></h1>
            <p class="brand-subtitle">Tap a review below to copy it and instantly open our Google page to paste it!</p>
            <div class="star-banner">★★★★★</div>
        </header>

        <div class="controls-header">
            <h2 class="controls-title">Suggested Reviews</h2>
            <button class="refresh-btn" id="refresh-btn" aria-label="Load different reviews">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
        </div>

        <div class="cards-list" id="cards-container">
        </div>

    </main>

    <div class="toast" id="toast">Copied! Opening Google Maps...</div>

    <footer class="footer">
        &copy; <span id="year"></span> Al-Taiba Crispy Chicken Center
    </footer>

    <script>
        const REVIEW_REDIRECT_URL = "https://maps.app.goo.gl/QyvXdGpJPUrRirwr9";

        const presetReviews = [
            "Nice Mandi.", "Awesome taste.", "Good food in Frazer Town.", "Tasty Mandi rice.", "Very good chicken.",
            "Best place for a quick bite.", "Chicken was crispy.", "Liked the crispy chicken.", "Food was served hot.",
            "Mandi was decent.", "Fresh and tasty.", "Good flavor.", "Friendly staff.", "Will visit Frazer Town branch again.",
            "Nice quantity.", "Chicken Mandi was very flavorful.", "Loved the crispy chicken strips here.",
            "Portion of the Mandi was really good.", "Popcorn chicken is a nice snack.", "Tried Mandi for the first time, it was nice.",
            "The burger had a good crispy patty.", "Chicken lollipop was well cooked.", "Mandi rice had perfect spice.",
            "Fries and crispy chicken were good.", "Enjoyed the Chicken Mandi here in Frazer Town.", "The chicken wings were tasty and hot.",
            "Good place to have Mandi with friends.", "Pizza was surprisingly good.", "The tender chicken in the Mandi was nice.",
            "Crispy chicken bucket is worth it.", "Mandi quantity is enough for sharing.", "Ordered the chicken strips, tasted fresh.",
            "Nice spot for a quick chicken burger.", "Mandi was served warm and tasted great.", "The chicken starters are really good.",
            "Great place for crispy chicken in Frazer Town.", "Chicken Mandi is good to try here.", "Burger and fries was a good combo.",
            "Really liked the flavor of the Mandi rice.", "The popcorn chicken is very crunchy.", "Mandi chicken was soft and flavorful.",
            "Liked the crispy wings.", "Good Mandi portion for the price.", "Chicken strips were juicy inside.",
            "Nice place for a quick pizza.", "Had Mandi with family, everyone liked it.", "The crispy chicken stayed crunchy even in takeaway.",
            "Visited the Frazer Town branch, the Mandi was nice.", "Burger was good and the fries were properly salted.",
            "Mandi is totally worth the price here.", "Good place to hang out and have chicken.", "Popcorn chicken is great for sharing with friends.",
            "The Mandi rice was fluffy and well seasoned.", "Crispy chicken here is better than many other places.",
            "Pizza crust was soft and toppings were good.", "Chicken lollipop was spicy and tasty.", "Friendly service and the Mandi came out quick.",
            "Nice little shop in Frazer Town for fried chicken.", "The combination of rice and chicken in Mandi was perfect.",
            "Portions are generous, especially the Mandi.", "Crispy burger was filling and tasted fresh.", "Took a takeaway of Mandi, packaging was good.",
            "Chicken wings had a nice coating.", "Good spot for dinner, the Mandi was filling.", "Strips and popcorn chicken are my regular order.",
            "Staff at Frazer Town branch are very polite.", "Mandi was served quickly without much wait.", "Service is fast and crispy chicken is always hot.",
            "Good customer service and tasty food.", "The guy at the counter was helpful with the menu.", "Nice clean place with fast service.",
            "Ordered Chicken Mandi, arrived at the table very fast.", "Good service, they packed the takeaway neatly.",
            "Very quick service for the chicken starters.", "The staff made sure the food was fresh.", "We had Chicken Mandi and crispy wings, both were good.",
            "Tried the crispy burger and some popcorn chicken.", "Ordered pizza and fries, nice combo for a quick meal.",
            "The Mandi and chicken lollipop went well together.", "Had the chicken strips and a burger, very filling.",
            "Popcorn chicken and Mandi made a great dinner.", "We shared a crispy bucket and some fries.", "Chicken wings and pizza were both served hot.",
            "Tried both the Mandi and the fried chicken, no complaints.", "Loaded up on chicken starters and some Mandi rice.",
            "Mandi offers great value for money here.", "The prices in this Frazer Town branch are very reasonable.",
            "You get a lot of Mandi rice for the price.", "Good portion sizes on the crispy chicken.", "Affordable place for a good non-veg meal.",
            "Definitely coming back for the Mandi.", "One of the better places for chicken in Frazer Town.", "Always a good experience eating here.",
            "Simple, clean, and serves good food.", "Glad they opened this branch in Frazer Town.",
            "Went with my friends to try the Mandi. The chicken was cooked perfectly and the rice had a lot of flavor.",
            "I usually get the crispy burger, but tried the Chicken Mandi this time. Really impressed with the portion size.",
            "Good spot in Frazer Town if you want quick fried chicken or a proper Mandi meal. The service was also quite fast.",
            "Took my family here for dinner. We ordered Mandi and some chicken lollipops. Everything was served hot and tasted fresh.",
            "The popcorn chicken is super crispy, and their Mandi is very filling. Nice addition to the food scene here."
        ];

        let currentSelection = [];
        let hasSelected = false;

        function getRandomReviews() {
            const shuffled = [...presetReviews].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, 3);
        }

        function renderCards() {
            hasSelected = false; // Reset lock state when new reviews load
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            currentSelection = getRandomReviews();

            currentSelection.forEach((text, index) => {
                const card = document.createElement('div');
                card.className = 'review-card';
                card.innerHTML = `
                    <div class="card-rating">
                        <span>★★★★★</span>
                        <span class="card-tag">Option ${index + 1}</span>
                    </div>
                    <p class="review-text">"${text}"</p>
                    <div class="card-action">
                        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                        Tap to Select & Open Maps
                    </div>
                `;

                card.addEventListener('click', () => handleCardClick(text, card));
                container.appendChild(card);
            });
        }

        async function handleCardClick(text, cardElement) {
            if (hasSelected) return; // Prevent multiple clicks
            hasSelected = true;

            // Lock all other cards
            const allCards = document.querySelectorAll('.review-card');
            allCards.forEach(card => {
                if (card !== cardElement) {
                    card.classList.add('disabled');
                }
            });

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                }

                cardElement.classList.add('copied');
                const actionBtn = cardElement.querySelector('.card-action');
                actionBtn.innerHTML = `✓ Copied! Redirecting...`;
                showToast();

                setTimeout(() => {
                    const isAndroid = /Android/i.test(navigator.userAgent);
                    
                    if (isAndroid) {
                        try {
                            const urlObj = new URL(REVIEW_REDIRECT_URL);
                            const fallbackUrl = encodeURIComponent(REVIEW_REDIRECT_URL);
                            // Intent syntax forces the native Maps app, with a fallback to the browser URL if it fails
                            window.location.href = `intent://${urlObj.host}${urlObj.pathname}${urlObj.search}${urlObj.hash}#Intent;scheme=https;package=com.google.android.apps.maps;S.browser_fallback_url=${fallbackUrl};end;`;
                        } catch (e) {
                            window.location.href = REVIEW_REDIRECT_URL;
                        }
                    } else {
                        // iOS and Desktop naturally prompt or handle HTTPS
                        window.location.href = REVIEW_REDIRECT_URL;
                    }
                }, 700);

            } catch (err) {
                window.location.href = REVIEW_REDIRECT_URL;
            }
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('year').textContent = new Date().getFullYear();
            renderCards();
            document.getElementById('refresh-btn').addEventListener('click', () => {
                if (!hasSelected) renderCards(); // Prevent refresh if locked
            });
        });
    </script>
</body>
</html>
